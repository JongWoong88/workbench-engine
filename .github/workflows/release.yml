# 게시. 배포선 v1에 push하면 시험을 통과한 뒤 npm 1.x를 게시한다(호환 규칙 K-1: v1에는 하위호환 변경만).
# 게시는 이 워크플로만 한다. npm 신뢰 게시(OIDC)를 쓰고 저장 토큰을 두지 않는다. 이미 있는 버전이면 건너뛴다.
# 첫 게시(0.0.0 자리표시)와 신뢰 게시 설정은 패키지 소유자가 npmjs.com에서 한 번 한다.
name: release
on:
  push:
    branches: [v1]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write  # npm 신뢰 게시와 출처 증명
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11  # 신뢰 게시는 npm 11.5.1 이상
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm test
      - run: npm run package:build
      - id: check
        name: 이미 게시한 버전이면 건너뛴다
        run: |
          name=$(node -p "require('./dist/package/package.json').name")
          version=$(node -p "require('./dist/package/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish ./dist/package --access public
