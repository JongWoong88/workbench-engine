# 보드 설정. 형식: references/workbench-format.md "board.yml"
columns:
  - id: backlog
    label: 📋 Backlog
    state: waiting
    color: '#8a9099'
  - id: on-hold
    label: 🧊 On Hold
    state: waiting
    color: '#8a9099'
  - id: discovery
    label: 🔍 Discovery
    state: active
    color: '#d9a441'
  - id: proposal
    label: 🤝 Proposal
    state: active
    color: '#d9a441'
  - id: design
    label: 📐 Design
    state: active
    color: '#d9a441'
  - id: planning
    label: 📝 Planning
    state: active
    color: '#4a88d0'
  - id: in-progress
    label: 🏃 In Progress
    state: active
    color: '#4a88d0'
  - id: done
    label: ✅ Done
    state: closed
    color: '#5aad76'
  - id: dropped
    label: 🗑️ Dropped
    state: closed
    color: '#c46a6a'
views:
  - id: view-1
    label: 진행 현황
    columns: [backlog, discovery, proposal, design, planning, in-progress]
description: |
  클라이언트 요구사항이 들어오면 아래 흐름으로 진행한다.

  1. **🔍 Discovery** (현황 조사) — 현행 프로젝트의 상태(코드·설정·데이터·운영 현황)를 조사한다.
  2. **🤝 Proposal** (제안·확정) — 현행안과 변경안을 클라이언트에게 안내하고 함께 결정해 요구사항을 확정한다.
  3. **📐 Design** (정책·기술 설계) — 정책 설계와 기술 설계를 진행한다.
  4. **📝 Planning** (작업계획·구현) — 작업계획을 수립한다. 계획서의 하위 작업은 부모의 `Sub-tasks`에 체크리스트로 적고, 각각 child task로 만들어 📋 Backlog에 넣는다. 부모에는 `[child 자식id]`, 자식에는 `[parent 부모id]` Relations를 적는다. 부모는 이 컬럼에 머무르고 child가 📋 Backlog → 🏃 In Progress → ✅ Done 순으로 흐른다. child가 모두 완료되면 부모도 ✅ Done으로 옮긴다.
  5. **🏃 In Progress** (작업중) — child 등 실행 단위 작업이 진행 중인 상태.
  6. **✅ Done** (완료) — 정상 종료.
  7. **🗑️ Dropped** (폐기) — 진행 도중 폐기된 작업. 이슈 lifecycle의 또 다른 종료점.

  그 밖의 상태:

  - **📋 Backlog** (백로그) — 착수 전 작업.
  - **🧊 On Hold** (중단) — 언제든 재개할 수 있는 작업. Backlog와 같은 레벨.
