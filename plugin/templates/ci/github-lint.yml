# workbench 문서 저장소 CI(.github/workflows/workbench-lint.yml). 형식 규칙 검사(lint)만 한다 —
# 웹 편집기 커밋처럼 로컬 검사를 거치지 않은 push를 잡는 안전망이다.
# 엔진은 실행할 때마다 npm 패키지 범위 ^1의 최신 버전을 받는다. 문서 저장소에는 패키지를 설치하지 않는다.
# wb sync가 push 전에 lint --all을 통과시킨 커밋에는 트레일러 Workbench-Lint: all-passed가 있어 push 때는 건너뛴다.
name: workbench lint
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'  # 주 1회. 엔진 갱신으로 생긴 경고를 본다
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Workbench-Lint: all-passed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # REC-FROZEN·LINK-REMOVED가 기록의 이력을 본다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @fiveeyes/workbench-engine@^1 lint --all
        env:
          WORKBENCH_ROOT: ${{ github.workspace }}
