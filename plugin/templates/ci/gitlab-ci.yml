# workbench 문서 저장소 CI. 형식 규칙 검사(lint)만 한다 — 웹 편집기 커밋처럼 로컬 검사를 거치지 않은 push를 잡는 안전망이다.
# 엔진은 실행할 때마다 npm 패키지 범위 ^1의 최신 버전을 받는다. 문서 저장소에는 패키지를 설치하지 않는다(package.json을 두지 않는다).
# wb sync가 push 전에 lint --all을 통과시킨 커밋에는 트레일러 Workbench-Lint: all-passed가 있어 push 때는 건너뛴다.
# 정기 실행(CI/CD → Schedules)을 걸어 두면 엔진 갱신으로 생긴 경고를 본다. 버전을 고정하려면 ^1 대신 정확한 버전을 적는다.
lint:
  stage: test
  image: node:22
  variables:
    GIT_DEPTH: 0  # REC-FROZEN·LINK-REMOVED가 기록의 이력을 본다
  script:
    - WORKBENCH_ROOT="$CI_PROJECT_DIR" npx -y @fiveeyes/workbench-engine@^1 lint --all
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
    - if: '$CI_COMMIT_MESSAGE =~ /^Workbench-Lint: all-passed$/m'
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
